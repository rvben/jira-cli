[package]
name = "jira-cli"
version = "0.3.16"
edition = "2024"
rust-version = "1.90"
description = "Agent-friendly Jira CLI with JSON output, structured exit codes, and schema introspection"
license = "MIT"
repository = "https://github.com/rvben/jira-cli"
homepage = "https://github.com/rvben/jira-cli"
keywords = ["jira", "atlassian", "cli", "issues"]
categories = ["command-line-utilities"]

[[bin]]
name = "jira"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "1.1"
owo-colors = "4"
dirs = "6"
base64 = "0.23"
mime_guess = { version = "2", default-features = false }
terminal_size = "0.4"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
jsonschema = "0.49.8"
