[package]
name = "jira-cli"
version = "0.4.8"
edition = "2024"
rust-version = "1.90"
description = "Agent-friendly Jira CLI with JSON output, structured exit codes, and schema introspection"
readme = "README.md"
license = "MIT"
repository = "https://github.com/rvben/jira-cli"
homepage = "https://github.com/rvben/jira-cli"
keywords = ["jira", "atlassian", "cli", "issues"]
categories = ["command-line-utilities"]

[[bin]]
name = "jira"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "1.1"
owo-colors = "4"
rpassword = "7"
dirs = "6"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
mime_guess = { version = "2", default-features = false }
terminal_size = "0.4"
tempfile = "3"
keyring = "4.1"
open = "5.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
jsonschema = "0.51.0"
