[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "jira-cli-rs"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
description = "Agent-friendly Jira CLI with JSON output, structured exit codes, and schema introspection"
readme = "README.md"
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/rvben/jira-cli"
Repository = "https://github.com/rvben/jira-cli"
Issues = "https://github.com/rvben/jira-cli/issues"

[tool.maturin]
bindings = "bin"
strip = true
